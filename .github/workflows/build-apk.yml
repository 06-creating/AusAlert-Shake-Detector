
name: Build AusAlert APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download AusAlert source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify original alarm recording is included
        run: |
          test -s app/src/main/res/raw/alarm.mp3 || { echo "::error::Missing app/src/main/res/raw/alarm.mp3. Upload the original alarm before building."; exit 1; }

      - name: Build AusAlert APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Verify APK contains the real alarm MP3
        run: |
          python3 - <<'PY'
          import glob, zipfile, sys
          apks=glob.glob('app/build/outputs/apk/debug/*.apk')
          if not apks:
              sys.exit('No APK was generated')
          for apk in apks:
              with zipfile.ZipFile(apk) as z:
                  matches=[n for n in z.namelist() if n.startswith('res/raw/') and n.endswith('.mp3')]
                  if not matches:
                      sys.exit('APK does not contain the alarm MP3: '+apk)
                  print('Verified real alarm MP3 in',apk, matches)
          PY

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: AusAlert-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
